<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 input types</title>
</head>
<body>
    Name:
        <input type ="text" placeholder="Enter name"><br></br>
    Password:
         <input type ="password" placeholder="Enter pasword"><br></br>
    Email:
         <input type ="email" placeholder="Enter Email"><br></br>     
    Number:
        <input type ="number" placeholder="Enter number"><br></br>
    Date:
         <input type ="Date" ><br></br>
    Time:
        <input type ="time" ><br></br>
    Month:
        <input type ="month" ><br></br>
    Week:
        <input type ="week" ><br></br>
    Date time-local:
        <input type ="date time-local" ><br></br>
    Url:
        <input type ="url" placeholder="Enter URL" ><br></br>
    Tel:
        <input type ="tel" placeholder="enter telephone number" ><br></br>
    Search:
        <input type ="search" ><br></br>
    Color:
        <input type ="color" ><br></br>
    Range:
        <input type ="range" ><br></br>
    File:
        <input type ="file" ><br></br>
    Radio:
        <input type ="radio" name="gender">Female
        <input type ="radio" name="gender">Male <br></br>
    checkbox:
        <input type ="checkbox" ><br></br>
    Submit:
         <input type ="submit" ><br></br>
    Reset:
         <input type ="Reset" ><br></br>
    Button: 
        <input type ="button" ><br></br>
    Hidden:
        <input type ="Hidden" ><br></br>








    
</body>
</html>
